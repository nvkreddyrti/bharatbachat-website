<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Round-Up Savings - Bharat Bachat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FF9933 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1e3a8a;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            color: #1e3a8a;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #FF9933;
            box-shadow: 0 0 0 3px rgba(255, 153, 51, 0.1);
        }

        .slider-container {
            margin: 30px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .slider-label span {
            color: #1e3a8a;
            font-weight: 600;
        }

        .slider-value {
            color: #FF9933;
            font-size: 24px;
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(to right, #FF9933 0%, #FF9933 5%, #e0e0e0 5%, #e0e0e0 100%);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #FF9933;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 153, 51, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #FF9933;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(255, 153, 51, 0.3);
        }

        .calculate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #FF9933 0%, #e68a00 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 153, 51, 0.3);
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 153, 51, 0.4);
        }

        .results {
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 153, 51, 0.1) 0%, rgba(30, 58, 138, 0.1) 100%);
            border-radius: 16px;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            color: #1e3a8a;
            font-weight: 600;
        }

        .result-value {
            color: #FF9933;
            font-size: 24px;
            font-weight: 700;
        }

        .example-box {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border-left: 4px solid #FF9933;
        }

        .example-box h3 {
            color: #1e3a8a;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .example-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #666;
            font-size: 14px;
        }

        .example-item .amount {
            color: #FF9933;
            font-weight: 600;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #2d4a9f;
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .calculator-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="header">
            <h1>💸 UPI Round-Up Savings</h1>
            <p>See how small change creates big wealth</p>
        </div>

        <div class="input-group">
            <label for="monthlyTransactions">Monthly UPI Transactions</label>
            <input type="number" id="monthlyTransactions" placeholder="e.g., 50" min="0">
        </div>

        <div class="input-group">
            <label for="avgAmount">Average Transaction Amount (₹)</label>
            <input type="number" id="avgAmount" placeholder="e.g., 250" min="0">
        </div>

        <div class="slider-container">
            <div class="slider-label">
                <span>Round-Up to Nearest:</span>
                <span class="slider-value" id="roundUpValue">₹10</span>
            </div>
            <input type="range" id="roundUpSlider" min="5" max="100" step="5" value="10" oninput="updateRoundUpValue()">
            <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: #999;">
                <span>₹5</span>
                <span>₹50</span>
                <span>₹100</span>
            </div>
        </div>

        <button class="calculate-btn" onclick="calculateUPI()">Calculate My UPI Savings</button>

        <div class="results" id="results">
            <div class="result-item">
                <span class="result-label">Monthly Round-Up Savings</span>
                <span class="result-value" id="monthlySavings">₹0</span>
            </div>
            <div class="result-item">
                <span class="result-label">Annual Savings</span>
                <span class="result-value" id="annualSavings">₹0</span>
            </div>
            <div class="result-item">
                <span class="result-label">5-Year Wealth (10% p.a. growth)</span>
                <span class="result-value" id="fiveYearWealth">₹0</span>
            </div>

            <div class="example-box">
                <h3>💡 How It Works - Live Examples</h3>
                <div id="examplesContainer"></div>
            </div>
        </div>

        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <script>
        function updateRoundUpValue() {
            const value = document.getElementById('roundUpSlider').value;
            document.getElementById('roundUpValue').textContent = `₹${value}`;
            
            // Update slider gradient
            const slider = document.getElementById('roundUpSlider');
            const percentage = ((value - slider.min) / (slider.max - slider.min)) * 100;
            slider.style.background = `linear-gradient(to right, #FF9933 0%, #FF9933 ${percentage}%, #e0e0e0 ${percentage}%, #e0e0e0 100%)`;
        }

        function calculateUPI() {
            const transactions = parseFloat(document.getElementById('monthlyTransactions').value) || 0;
            const avgAmount = parseFloat(document.getElementById('avgAmount').value) || 0;
            const roundUpTo = parseFloat(document.getElementById('roundUpSlider').value);
            
            if (transactions === 0 || avgAmount === 0) {
                alert('Please enter both monthly transactions and average amount!');
                return;
            }

            // Calculate average round-up per transaction
            // Assuming random distribution, avg round-up = roundUpTo / 2
            const avgRoundUp = roundUpTo / 2;
            const monthlySavings = transactions * avgRoundUp;
            const annualSavings = monthlySavings * 12;
            
            // Future value calculation: FV = PMT * [((1 + r)^n - 1) / r]
            const monthlyRate = 0.10 / 12; // 10% annual
            const months = 5 * 12; // 5 years
            const fiveYearWealth = monthlySavings * (((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate));

            // Display results
            document.getElementById('monthlySavings').textContent = `₹${Math.round(monthlySavings).toLocaleString('en-IN')}`;
            document.getElementById('annualSavings').textContent = `₹${Math.round(annualSavings).toLocaleString('en-IN')}`;
            document.getElementById('fiveYearWealth').textContent = `₹${Math.round(fiveYearWealth).toLocaleString('en-IN')}`;

            // Generate examples
            generateExamples(avgAmount, roundUpTo);

            // Show results
            document.getElementById('results').classList.add('show');
        }

        function generateExamples(avgAmount, roundUpTo) {
            const container = document.getElementById('examplesContainer');
            container.innerHTML = '';

            // Generate 5 example transactions
            for (let i = 0; i < 5; i++) {
                // Random amount around avgAmount (±30%)
                const variation = (Math.random() * 0.6 - 0.3);
                const amount = Math.max(10, avgAmount * (1 + variation));
                const roundedAmount = Math.ceil(amount / roundUpTo) * roundUpTo;
                const savedAmount = roundedAmount - amount;

                const exampleDiv = document.createElement('div');
                exampleDiv.className = 'example-item';
                exampleDiv.innerHTML = `
                    <span>Paid ₹${amount.toFixed(2)} → Rounded to ₹${roundedAmount}</span>
                    <span class="amount">+₹${savedAmount.toFixed(2)}</span>
                `;
                container.appendChild(exampleDiv);
            }
        }

        // Initialize slider
        updateRoundUpValue();
    </script>
</body>
</html>
